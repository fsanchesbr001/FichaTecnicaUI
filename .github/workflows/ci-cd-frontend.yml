name: Frontend CI/CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ficha-tecnica-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ficha-tecnica-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Compose for transfer
        id: compose
        run: echo "content=$(base64 -w 0 docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_BASE64: ${{ steps.compose.outputs.content }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          FRONTEND_IMAGE_TAG: ${{ github.sha }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '8081' }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          envs: COMPOSE_BASE64,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,BACKEND_API_URL,FRONTEND_IMAGE_TAG,FRONTEND_PORT
          command_timeout: 15m
          script: |
            set -eu
            : "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME}"
            : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN}"
            : "${BACKEND_API_URL:?Missing BACKEND_API_URL}"
            : "${FRONTEND_IMAGE_TAG:?Missing FRONTEND_IMAGE_TAG}"
            if ! printf '%s\n' "$FRONTEND_PORT" | grep -Eq '^[1-9][0-9]{0,4}$' || [ "$FRONTEND_PORT" -gt 65535 ]; then
              echo "FRONTEND_PORT must be a port number between 1 and 65535" >&2
              exit 1
            fi
            BACKEND_API_URL="${BACKEND_API_URL%/}"
            if ! printf '%s\n' "$BACKEND_API_URL" | grep -Eq '^https://[a-zA-Z0-9.-]+(:[0-9]+)?$'; then
              echo "BACKEND_API_URL must be an HTTPS origin without path or credentials" >&2
              exit 1
            fi
            command -v docker >/dev/null
            command -v curl >/dev/null
            docker compose version
            if ! curl --silent --show-error --connect-timeout 10 --max-time 15 \
              --output /dev/null "$BACKEND_API_URL/actuator/health"; then
              echo "Backend HTTPS connection failed before changing the deployment: $BACKEND_API_URL" >&2
              echo "Check DNS, connectivity, and the backend certificate chain and Subject Alternative Names (SAN)." >&2
              echo "The certificate must cover the hostname in BACKEND_API_URL. Do not disable TLS verification." >&2
              exit 1
            fi
            umask 077
            mkdir -p /opt/ficha-tecnica-ui
            cd /opt/ficha-tecnica-ui
            printf '%s' "$COMPOSE_BASE64" | base64 -d > docker-compose.yml
            printf 'DOCKERHUB_USERNAME=%s\nBACKEND_API_URL=%s\nFRONTEND_PORT=%s\nFRONTEND_IMAGE_TAG=%s\n' \
              "$DOCKERHUB_USERNAME" "$BACKEND_API_URL" "$FRONTEND_PORT" "$FRONTEND_IMAGE_TAG" > .env
            chmod 600 .env
            docker compose config --quiet
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            unset DOCKERHUB_TOKEN
            docker compose pull
            docker compose up -d --force-recreate
            docker compose exec -T frontend nginx -t
            if ! FRONTEND_STATUS="$(curl --fail --silent --show-error --retry 10 --retry-connrefused \
              --retry-delay 3 --max-time 10 --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:$FRONTEND_PORT/")" || [ "$FRONTEND_STATUS" != "200" ]; then
              echo "Frontend did not return HTTP 200" >&2
              docker compose logs --tail 100 frontend
              exit 1
            fi
            HEALTH_BODY="$(mktemp)"
            trap 'rm -f "$HEALTH_BODY"' EXIT
            if ! BACKEND_STATUS="$(curl --fail --silent --show-error --retry 5 --retry-connrefused \
              --retry-delay 3 --max-time 15 --output "$HEALTH_BODY" --write-out '%{http_code}' \
              "http://127.0.0.1:$FRONTEND_PORT/api/actuator/health")" \
              || [ "$BACKEND_STATUS" != "200" ] \
              || ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' "$HEALTH_BODY"; then
              echo "Backend proxy must return HTTP 200 with status UP" >&2
              docker compose logs --tail 100 frontend
              exit 1
            fi
            docker image prune -f
