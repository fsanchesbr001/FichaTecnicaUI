name: Frontend CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ficha-tecnica-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ficha-tecnica-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Compose for transfer
        id: compose
        run: echo "content=$(base64 -w 0 docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_BASE64: ${{ steps.compose.outputs.content }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          envs: COMPOSE_BASE64,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,BACKEND_API_URL
          command_timeout: 15m
          script: |
            set -eu
            : "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME}"
            : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN}"
            : "${BACKEND_API_URL:?Missing BACKEND_API_URL}"
            BACKEND_API_URL="${BACKEND_API_URL%/}"
            if ! printf '%s\n' "$BACKEND_API_URL" | grep -Eq '^https?://[a-zA-Z0-9.-]+(:[0-9]+)?$'; then
              echo "BACKEND_API_URL must be an HTTP(S) origin without path or credentials" >&2
              exit 1
            fi
            command -v docker >/dev/null
            command -v curl >/dev/null
            docker compose version
            umask 077
            mkdir -p /opt/ficha-tecnica-ui
            cd /opt/ficha-tecnica-ui
            printf '%s' "$COMPOSE_BASE64" | base64 -d > docker-compose.yml
            printf 'DOCKERHUB_USERNAME=%s\nBACKEND_API_URL=%s\n' \
              "$DOCKERHUB_USERNAME" "$BACKEND_API_URL" > .env
            chmod 600 .env
            docker compose config --quiet
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            unset DOCKERHUB_TOKEN
            docker compose pull
            docker compose up -d --force-recreate
            docker compose exec -T frontend nginx -t
            if ! curl --fail --silent --show-error --retry 10 --retry-connrefused \
              --retry-delay 3 --max-time 10 http://127.0.0.1/ > /dev/null; then
              docker compose logs --tail 100 frontend
              exit 1
            fi
            docker image prune -f
