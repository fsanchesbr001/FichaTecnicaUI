services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - ficha_tecnica_network

networks:
  ficha_tecnica_network:
    external: true
    name: ficha_tecnica_network
