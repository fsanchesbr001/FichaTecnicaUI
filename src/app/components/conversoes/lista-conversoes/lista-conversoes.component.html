<h3 class="lista-conversoes-titulo">Conversões</h3>
<div class="lista-conversoes-table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
    <!-- UnidadeDe -->
    <ng-container matColumnDef="unidadeDe">
      <th mat-header-cell *matHeaderCellDef class="col-unidadeDeOrigem">De</th>
      <td mat-cell *matCellDef="let conversao" class="col-unidadeDeOrigem">{{ conversao.unidadeDe }}</td>
    </ng-container>

    <!-- UnidadePara -->
    <ng-container matColumnDef="unidadePara">
      <th mat-header-cell *matHeaderCellDef class="col-unidadeDeDestino">Para</th>
      <td mat-cell *matCellDef="let conversao" class="col-unidadeDeDestino">{{ conversao.unidadePara }}</td>
    </ng-container>

    <!-- Operacao -->
    <ng-container matColumnDef="operacao">
      <th mat-header-cell *matHeaderCellDef class="col-operacao">Operação</th>
      <td mat-cell *matCellDef="let conversao" class="col-operacao">{{ conversao.operacao }}</td>
    </ng-container>

    <!-- Valor (Fator) -->
    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef class="col-fator">Fator</th>
      <td mat-cell *matCellDef="let conversao" class="col-fator">{{ conversao.valor | number:'1.0-0' }}</td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="col-acoes">Ações</th>
      <td mat-cell *matCellDef="let conversao" class="col-acoes">
        <button mat-icon-button matTooltip="Alterar" aria-label="Alterar" (click)="onEditar(conversao)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Apagar" aria-label="Apagar" style="margin-left:5px;" (click)="onExcluir(conversao)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  <div class="lista-conversoes-footer">
    <button mat-raised-button color="primary" (click)="onNovo()">
      <mat-icon>add</mat-icon>
      Adicionar
    </button>
    <button mat-raised-button color="accent" (click)="onImprimir()">
      <mat-icon>print</mat-icon>
      Imprimir
    </button>
  </div>
</div>
