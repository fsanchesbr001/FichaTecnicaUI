<h3 class="lista-medidas-titulo">Itens</h3>
<div class="lista-medidas-table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
    <!-- Nome -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef class="col-nome">Nome</th>
      <td mat-cell *matCellDef="let item" class="col-nome">{{ item.nome }}</td>
    </ng-container>

    <!-- Unidade -->
    <ng-container matColumnDef="unidade">
      <th mat-header-cell *matHeaderCellDef class="col-unidade">Unidade</th>
      <td mat-cell *matCellDef="let item" class="col-unidade">{{ item.unidadeMedida?.nome }}</td>
    </ng-container>

    <!-- Valor -->
    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef class="col-valor">Valor</th>
      <td mat-cell *matCellDef="let item" class="col-valor">{{ item.valor }}</td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="col-acoes">Ações</th>
      <td mat-cell *matCellDef="let item" class="col-acoes">
        <button mat-icon-button matTooltip="Alterar" aria-label="Alterar" (click)="onEditar(item)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Apagar" aria-label="Apagar" style="margin-left:5px;" (click)="onExcluir(item)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  <div class="lista-medidas-footer">
    <button mat-raised-button color="primary" (click)="onNovo()">
      <mat-icon>add</mat-icon>
      Adicionar
    </button>
    <button mat-raised-button color="accent" (click)="onImprimir()">
      <mat-icon>print</mat-icon>
      Imprimir
    </button>
  </div>
</div>
