<h3 class="lista-titulo">Produtos</h3>
<div class="lista-table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

    <!-- Produto (Nome) -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef class="col-nome">Produto</th>
      <td mat-cell *matCellDef="let produto" class="col-nome">{{ produto.nome }}</td>
    </ng-container>

    <!-- Preço Venda -->
    <ng-container matColumnDef="precoVenda">
      <th mat-header-cell *matHeaderCellDef class="col-preco">Preço Venda</th>
      <td mat-cell *matCellDef="let produto" class="col-preco">{{ produto.valorVenda }}</td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="col-acoes">Ações</th>
      <td mat-cell *matCellDef="let produto" class="col-acoes">
        <button mat-icon-button matTooltip="Alterar" aria-label="Alterar" (click)="onEditar(produto)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Apagar" aria-label="Apagar" style="margin-left:5px;" (click)="onExcluir(produto)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  <div class="lista-footer">
    <button mat-raised-button color="primary" (click)="onNovo()">
      <mat-icon>add</mat-icon>
      Adicionar
    </button>
    <button mat-raised-button color="accent" (click)="onImprimir()">
      <mat-icon>print</mat-icon>
      Imprimir
    </button>
  </div>
</div>
